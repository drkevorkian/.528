[client]
# Replace these with your reachable Gentoo licensing host/IP on other machines.
# Keep localhost/127.0.0.1 only when the client and licensing server run on the same system.
primary_url = "http://localhost:3000"
backup_url = "http://127.0.0.1:3000"
license_key = ""
connect_timeout_ms = 1500
request_timeout_ms = 5000
refresh_interval_s = 3600
contact_email = "support@localhost"
help_url = "http://localhost:3000"

[admin]
# Client-facing URL used by the native srs_admin application.
# Override with SRS_ADMIN_BASE_URL. Authentication comes from SRS_ADMIN_TOKEN,
# never from this file.
base_url = "http://localhost:3000"

[server]
# Development mode is loopback-only. To serve remote clients, explicitly switch
# operating_mode to "production", configure a unique signing seed/admin token,
# use a production HTTPS base URL, and then choose the intended public bind.
bind_addr = "127.0.0.1:3000"
# In production this must be the HTTPS URL clients actually reach.
base_url = "http://localhost:3000"
database_path = "var/srs_license.sqlite3"
confirmation_window_hours = 72
token_ttl_hours = 24
# mail_from = "noreply@example.com"
# smtp_server = "127.0.0.1"
# smtp_username = "smtp-user"
# smtp_password = "smtp-password"

# development | production
# operating_mode = "development"
# Required for issuance and /admin APIs. Prefer the SRS_ADMIN_TOKEN environment variable.
# admin_token = ""
